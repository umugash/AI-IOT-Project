[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbannoise-aiot"
version = "0.1.0"
description = "Software-only urban noise analysis and AIoT simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "folium>=0.16",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[tool.setuptools.packages.find]
where = ["src"]
